name: Release candidate
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate-tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.14.0'
      - name: Verify version and main ancestry
        run: |
          node --input-type=module -e 'import fs from "node:fs"; import assert from "node:assert/strict"; const p=JSON.parse(fs.readFileSync("package.json")); assert.equal(process.env.GITHUB_REF_NAME,"v"+p.version); assert.match(p.version,/^\d+\.\d+\.\d+$/);'
          git merge-base --is-ancestor HEAD origin/main
  build:
    needs: validate-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
            platform: mac
            folder: mac-arm64
          - os: macos-15-intel
            arch: x64
            platform: mac
            folder: mac
          - os: windows-2025
            arch: x64
            platform: win
            folder: win-unpacked
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.14.0'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:e2e
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run notices
      - name: Package unsigned installer
        run: npm run package -- --${{ matrix.platform }} --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify installation, replacement and packaged application
        run: npm run test:packaged
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.exe
            test-results/packaged-*.json
          if-no-files-found: error
          retention-days: 14
  compatibility:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            arch: arm64
          - os: macos-26-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.14.0'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: candidate-mac-${{ matrix.arch }}
          path: candidate
      - name: Use the exact native installer on macOS 26
        run: |
          mkdir -p release
          cp candidate/release/*.dmg release/
      - run: mkdir -p test-results
      - run: npm run test:packaged
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compatibility-${{ matrix.arch }}
          path: test-results/packaged-*.json
  draft:
    needs: [build, compatibility]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: candidate-*
          path: candidate
      - name: Assemble exact tested assets and checksums
        run: |
          mkdir assets
          find candidate -type f \( -name '*.dmg' -o -name '*.exe' \) -exec cp {} assets/ \;
          test "$(find assets -type f | wc -l)" -eq 3
          cp THIRD_PARTY_NOTICES.md docs/RELEASE_NOTES.md assets/
          cd assets
          sha256sum *.dmg *.exe > SHA256SUMS.txt
      - name: Create draft without replacing an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" assets/* --verify-tag --draft --prerelease --title "Study Desk $GITHUB_REF_NAME — unsigned preview" --notes-file docs/RELEASE_NOTES.md
